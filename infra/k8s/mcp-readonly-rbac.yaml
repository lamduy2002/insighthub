apiVersion: v1
kind: Namespace
metadata:
  name: insighthub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-readonly
  namespace: insighthub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mcp-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-readonly
subjects:
  - kind: ServiceAccount
    name: mcp-readonly
    namespace: insighthub
roleRef:
  kind: ClusterRole
  name: mcp-readonly
  apiGroup: rbac.authorization.k8s.io
