{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "localdeps.redisName" . }}
  labels:
    {{- include "localdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "localdeps.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
