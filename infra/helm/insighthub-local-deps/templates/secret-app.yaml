{{- if .Values.appSecret.create }}
{{- /*
Secret mà chart app đọc theo TÊN. Trên dev, Secret cùng tên/khoá do Secrets Store
CSI sync ra từ Secrets Manager → Deployment api/worker không đổi giữa 2 môi trường.
CẢNH BÁO: credential dưới đây là GIẢ, chỉ dùng trong cluster kind.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appSecret.name }}
  labels:
    {{- include "localdeps.labels" . | nindent 4 }}
  annotations:
    insighthub.local/warning: "LOCAL ONLY - fake credentials for kind, never reuse"
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-local - xem SPEC.md muc 13
type: Opaque
stringData:
  # Local không TLS: postgres không sslmode=require, redis không auth (N.10).
  {{ .Values.appSecret.databaseUrlKey }}: postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "localdeps.postgresName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.postgres.service.port }}/{{ .Values.postgres.auth.database }}
  {{ .Values.appSecret.redisUrlKey }}: redis://{{ include "localdeps.redisName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.redis.service.port }}/0
{{- end }}
