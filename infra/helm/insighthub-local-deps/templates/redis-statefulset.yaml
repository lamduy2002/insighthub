{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "localdeps.redisName" . }}
  labels:
    {{- include "localdeps.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ include "localdeps.redisName" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "localdeps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "localdeps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.redis.runAsUser }}
        runAsGroup: {{ .Values.redis.runAsGroup }}
        fsGroup: {{ .Values.redis.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ include "localdeps.image" .Values.redis.image }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          # Queue job (payload ≤10MB) không cần bền vững giữa các lần chạy lab:
          # emptyDir, không AOF/RDB. Local không auth, không TLS (N.10).
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
