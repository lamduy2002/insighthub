{{- if .Values.appServiceAccount.create }}
{{- /*
ServiceAccount mà pod của chart app chạy dưới (web/api/worker + migration Job).
Đặt ở ĐÂY, không ở chart app, để đối xứng với dev: trên EKS, SA `insighthub`
do Terraform root platform tạo kèm annotation eks.amazonaws.com/role-arn
(IRSA, MH6) TRƯỚC khi release app được cài. Chart local-deps cũng cài trước
chart app → cả hai môi trường, SA luôn tồn tại sẵn và chart app chỉ tham
chiếu theo tên (serviceAccount.create=false ở mọi values).

Nhờ vậy không cần hook helm.sh/hook pre-install trong chart app nữa — hook đó
trước đây chỉ để ép SA ra đời trước migration Job (cũng là hook).

Local không có IRSA nên SA trần, không annotation.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appServiceAccount.name }}
  labels:
    {{- include "localdeps.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-local - xem SPEC.md muc 13
automountServiceAccountToken: false
{{- end }}
