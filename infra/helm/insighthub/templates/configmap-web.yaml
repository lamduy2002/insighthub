{{- /*
web gọi api server-side qua API_INTERNAL_URL (web/lib/api.ts:4), đọc lúc runtime
nên không cần build lại image khi đổi giá trị (N.5).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insighthub.webConfigMapName" . }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-<env> - xem SPEC.md muc 13
data:
  API_INTERNAL_URL: http://{{ include "insighthub.apiServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}
