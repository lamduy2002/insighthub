{{- if .Values.serviceAccount.create }}
{{- /*
Chỉ tạo ở local. Trên dev, SA `insighthub` do Terraform root platform tạo kèm
annotation eks.amazonaws.com/role-arn (IRSA, MH6) — chart không được ghi đè.

Là hook weight -20: migration Job (hook weight 0) chạy bằng SA này, mà hook luôn
chạy TRƯỚC resource thường → SA phải tồn tại từ trước, đúng như trên dev nơi SA
do Terraform tạo trước cả release. Không dùng hook-succeeded: SA phải sống suốt
vòng đời pod. Hệ quả: `helm uninstall` không xoá SA, teardown xoá tường minh.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "insighthub.serviceAccountName" . }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
