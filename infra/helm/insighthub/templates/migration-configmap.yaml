{{- if .Values.migration.enabled }}
{{- /*
SQL nhận qua --set-file migration.initSql=infra/db/init.sql: MỘT nguồn duy nhất,
không copy init.sql vào chart (DAY3-CHECKLIST N.6).
Hook weight -5: tạo sau SecretProviderClass (-10), trước Job (0).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insighthub.fullname" . }}-migration-sql
  labels:
    {{- include "insighthub.componentLabels" (dict "ctx" . "component" "migration") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-<env> - xem SPEC.md muc 13
{{- /*
Guard: placeholder chỉ được phép tồn tại khi render tĩnh (Checkov/`helm template`).
Deploy thật mà chưa truyền --set-file thì fail ngay. Xem "insighthub.isTemplateRender".
*/ -}}
{{- $sql := .Values.migration.initSql | required "migration.initSql trống — bắt buộc truyền --set-file migration.initSql=infra/db/init.sql" -}}
{{- if and (hasPrefix (include "insighthub.initSqlPlaceholderPrefix" .) (trim $sql)) (not (include "insighthub.isTemplateRender" .)) -}}
{{- fail "migration.initSql vẫn là placeholder — deploy thật phải truyền --set-file migration.initSql=infra/db/init.sql" -}}
{{- end }}
data:
  init.sql: |
{{ $sql | indent 4 }}
{{- end }}
