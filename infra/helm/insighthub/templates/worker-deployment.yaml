{{- /*
Không có Service: worker không mở cổng HTTP (health endpoint là Should-have Day 1
chưa làm — DAY3-CHECKLIST N.8). Probe dùng exec `arq --check`.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-ingestion-worker
  labels:
    {{- include "insighthub.componentLabels" (dict "ctx" . "component" "ingestion-worker") | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-<env> - xem SPEC.md muc 13
    checkov.io/skip2: CKV_K8S_40=UID nuong trong image (app 1001, pgvector 999); doi UID phai build lai image va chown lai filesystem - xem SPEC.md muc 10
    checkov.io/skip3: CKV_K8S_43=local nap image bang kind load nen khong co digest; dev truyen image.<svc>.digest lay tu ECR sau khi push, repo image_tag_mutability IMMUTABLE - xem SPEC.md muc 12
    checkov.io/skip4: CKV_K8S_35=app doc DATABASE_URL/REDIS_URL tu env (api/app/core/config.py); chuyen sang secret dang file phai sua code app - xem SPEC.md muc 10
    checkov.io/skip5: CKV2_K8S_6=EKS VPC CNI chua bat network policy agent nen NetworkPolicy khong duoc thuc thi; them policy khong enforce la cam giac an toan gia va de chan nham traffic ALB target-type ip - xem SPEC.md muc 10
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "insighthub.componentSelectorLabels" (dict "ctx" . "component" "ingestion-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "insighthub.componentSelectorLabels" (dict "ctx" . "component" "ingestion-worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-app.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "insighthub.serviceAccountName" . }}
      # Nhu api: IRSA + Secrets Store CSI dung token rieng (CKV_K8S_38).
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ingestion-worker
          image: {{ include "insighthub.image" (dict "ctx" $ "img" .Values.image.worker "component" "worker") }}
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "insighthub.configMapName" . }}
          env:
            {{- include "insighthub.secretEnv" . | nindent 12 }}
          livenessProbe:
            exec:
              command: ["arq", "--check", "worker.settings.WorkerSettings"]
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command: ["arq", "--check", "worker.settings.WorkerSettings"]
            {{- toYaml .Values.worker.livenessProbe | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "insighthub.csiVolumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "insighthub.csiVolume" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
