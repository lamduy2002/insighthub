{{- /* Env không bí mật dùng chung cho api + worker (cùng Settings, N.1). */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insighthub.configMapName" . }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-<env> - xem SPEC.md muc 13
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
