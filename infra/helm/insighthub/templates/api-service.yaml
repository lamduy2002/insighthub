apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.apiServiceName" . }}
  labels:
    {{- include "insighthub.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=helm template khong truyen -n nen render ra namespace default; cai dat that luon co -n insighthub-<env> - xem SPEC.md muc 13
    {{- with .Values.api.service.annotations }}
    {{- /* dev: alb.ingress.kubernetes.io/healthcheck-path=/readyz — health check
    của target group đặt trên Service, không phải trên Ingress. */ -}}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "insighthub.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
