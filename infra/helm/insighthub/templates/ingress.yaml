{{- if .Values.ingress.enabled }}
{{- /*
ALB do AWS Load Balancer Controller tạo (ngoài Terraform state) → teardown phải
xoá Ingress TRƯỚC khi gỡ controller, nếu không ALB bị bỏ sót và vẫn tính phí
(SPEC.md Mục 8 bước 1-3).
Acceptance §7.5 gọi thẳng /healthz, /documents, /chat trên host → route sang api;
web dùng prefix /api/* nên không trùng. KHÔNG public /metrics (N.5).
*/ -}}
{{- if not .Values.ingress.certificateArn }}{{ fail "ingress.certificateArn là bắt buộc khi ingress.enabled=true (ACM cert cho listener 443)" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "insighthub.fullname" . }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=helm khong ghi metadata.namespace vao manifest nen checkov luon thay default, ke ca khi render co -n; cai dat that luon co -n insighthub-<env> - xem SPEC.md muc 13
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # Web proxy chờ api tới 90s (web/app/api/proxy/route.ts:25) → idle timeout phải lớn hơn mặc định 60s.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds={{ .Values.ingress.idleTimeoutSeconds }}
    {{- with .Values.ingress.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{ if .Values.ingress.host }}host: {{ .Values.ingress.host | quote }}
      {{ end }}http:
        paths:
          # api trước, web nhận phần còn lại. Thứ tự path quan trọng với ALB.
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.apiServiceName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.apiServiceName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /documents
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.apiServiceName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.apiServiceName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "insighthub.webServiceName" . }}
                port:
                  number: {{ .Values.web.service.port }}
  {{- if .Values.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
  {{- end }}
{{- end }}
