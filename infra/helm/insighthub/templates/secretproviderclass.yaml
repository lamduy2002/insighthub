{{- if .Values.secretsStore.enabled }}
{{- /*
Hook pre-install,pre-upgrade weight -10: phải tồn tại trước migration Job (weight 0)
vì Job cũng mount CSI. KHÔNG dùng hook-succeeded — object này phải sống suốt vòng
đời pod api/worker; teardown xoá tường minh (SPEC.md Mục 8 bước 2).
*/ -}}
{{- if not .Values.secretsStore.dbSecretArn }}{{ fail "secretsStore.dbSecretArn là bắt buộc khi secretsStore.enabled=true (output core db_secret_arn)" }}{{ end }}
{{- if not .Values.secretsStore.redisSecretArn }}{{ fail "secretsStore.redisSecretArn là bắt buộc khi secretsStore.enabled=true (output core redis_secret_arn)" }}{{ end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "insighthub.secretProviderClassName" . }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: {{ .Values.secretsStore.provider }}
  parameters:
    objects: |
      - objectName: {{ .Values.secretsStore.dbSecretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: database_url
            objectAlias: {{ .Values.secrets.databaseUrlKey }}
      - objectName: {{ .Values.secretsStore.redisSecretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: redis_url
            objectAlias: {{ .Values.secrets.redisUrlKey }}
  # App chỉ đọc env, không đọc file (config.py không có secrets_dir) → phải sync
  # ra K8s Secret rồi dùng secretKeyRef; driver cần syncSecret.enabled=true (N.1).
  secretObjects:
    - secretName: {{ .Values.secrets.secretName }}
      type: Opaque
      data:
        - objectName: {{ .Values.secrets.databaseUrlKey }}
          key: {{ .Values.secrets.databaseUrlKey }}
        - objectName: {{ .Values.secrets.redisUrlKey }}
          key: {{ .Values.secrets.redisUrlKey }}
{{- end }}
