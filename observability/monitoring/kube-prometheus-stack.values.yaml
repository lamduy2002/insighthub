# kube-prometheus-stack tuned for the kind lab (2 vCPU / ~6 GB host).
# NFR 8.3: #2 resource limits on the Prometheus pod, #4 retention 15d.

fullnameOverride: kube-prom-stack

# kind runs the control plane with components bound to 127.0.0.1, so these
# scrape jobs can never come UP. Acceptance 8.5 wants every expected target UP.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Pick up ServiceMonitor/PrometheusRule objects regardless of release label,
    # so app-owned monitors in insighthub-local are scraped.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 6Gi

alertmanager:
  alertmanagerSpec:
    retention: 120h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

grafana:
  adminPassword: insighthub
  defaultDashboardsTimezone: Asia/Ho_Chi_Minh
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  persistence:
    enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi
