      for: 2m
      labels:
        severity: warning
        incident: queue-backlog
      annotations:
        summary: Ingestion queue depth is above its statistical band
        description: ARQ queue depth {{ $value | printf "%.0f" }} is above avg_1h + max(3*stddev_1h, 5).
