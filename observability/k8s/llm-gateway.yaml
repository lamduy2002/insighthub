# Day 6 MH10: lets the existing Day 4 Prometheus scrape the LiteLLM gateway that runs in docker compose
# (insighthub-day6) on the private "kind" docker network at a fixed address. Additive only: new namespace,
# Service, Endpoints and ServiceMonitor; no Day 4 object is modified. Remove with:
#   kubectl --context kind-insighthub-lab delete namespace llm-gateway
#   kubectl --context kind-insighthub-lab -n monitoring delete configmap llm-cost-dashboard
apiVersion: v1
kind: Namespace
metadata:
  name: llm-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
spec:
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: litellm
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
subsets:
  - addresses:
      - ip: 172.18.0.50
    ports:
      - name: http
        port: 4000
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
  namespace: llm-gateway
  labels:
    app.kubernetes.io/name: litellm
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  namespaceSelector:
    matchNames:
      - llm-gateway
  endpoints:
    - port: http
      path: /metrics/
      interval: 30s
      scrapeTimeout: 10s
